plugins {
    id 'com.android.application'
}

android {
    namespace 'no.norvel.app'
    compileSdk 36

    defaultConfig {
        applicationId 'no.norvel.app.v38'
        minSdk 24
        targetSdk 36
        versionCode 38
        versionName '1.0.38'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
