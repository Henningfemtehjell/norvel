name: Build Norvel APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified Norvel launcher logo
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode assets/norvel_launcher_v38.jpg.b64 > app/src/main/res/drawable/norvel_launcher.jpg
          test -s app/src/main/res/drawable/norvel_launcher.jpg
          file app/src/main/res/drawable/norvel_launcher.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk norvel-v38.apk

      - name: Upload Norvel APK
        uses: actions/upload-artifact@v4
        with:
          name: norvel-v38-apk
          path: norvel-v38.apk
